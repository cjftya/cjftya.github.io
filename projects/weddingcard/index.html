<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta property="og:title" content="Wedding Card">
  <title>Wedding Card</title>
  <link rel="stylesheet" href="security/lock.css">
  <link rel="stylesheet" href="security/viewer.min.css">
  <script type="module" src="security/lock.js"></script>
</head>
<body>
  <main id="lock">
    <form id="unlock-form" novalidate>
      <h1>Wedding Card</h1>
      <p>소중한 추억을 담은 초대장이에요.<br>전달받은 비밀번호를 입력해 주세요.</p>
      <label for="password">비밀번호</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button id="visibility" type="button" aria-controls="password" aria-pressed="false">표시</button>
      </div>
      <button type="submit">초대장 열기</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <noscript>초대장을 열려면 JavaScript를 활성화해 주세요.</noscript>
</body>
</html>
